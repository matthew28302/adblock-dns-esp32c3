[platformio]
default_envs = c3

[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = fatfs
; Native ESP-IDF app (IDF 6.x): the Arduino core's IDF-5.x flash stack cannot
; read this board's XTX 16MB flash (all partition reads come back 0xFF), and
; the prebuilt Arduino C3 bootloader (2024) can't even read the partition
; table. Everything here is built from current sources, which handle the chip.
